# Reusable workflow: builds a Decky plugin and publishes a GitHub release in
# the format decky-store-proxy consumes. Call it from a plugin repository:
#
#   on:
#     push:
#       tags: ["v*"]
#   permissions:
#     contents: write
#   jobs:
#     release:
#       uses: <owner>/decky-store-proxy/.github/workflows/release-plugin.yml@<commit-sha>
#
# Release contract (what the proxy relies on):
#   * tag `vX.Y.Z` == "v" + package.json `version` (strict SemVer)
#   * plugin.json `name` is the plugin's identity (must never change)
#   * assets: `<repo>.zip` (Decky install layout) and `decky-store.json`
#   * "Latest release" is only ever the highest stable version
name: Release Decky plugin

on:
  workflow_call:
    inputs:
      build-command:
        description: Command that builds the frontend into dist/
        type: string
        default: pnpm install --frozen-lockfile && pnpm run build
      node-version:
        type: string
        default: "22"
      extra-files:
        description: Extra files/directories (space-separated) to include in the plugin folder
        type: string
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needs all tags to decide "latest"

      - name: Validate release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [[ "$GITHUB_REF_TYPE" == tag ]] || fail "must run on a tag push, got $GITHUB_REF_TYPE"
          tag="$GITHUB_REF_NAME"
          [[ -f package.json ]] || fail "package.json missing"
          [[ -f plugin.json ]] || fail "plugin.json missing"
          version=$(jq -er .version package.json) || fail "package.json has no version"
          name=$(jq -er .name plugin.json) || fail "plugin.json has no name"

          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          [[ "$version" =~ $semver ]] || fail "package.json version '$version' is not SemVer"
          [[ "$tag" == "v$version" ]] || fail "tag '$tag' does not match package.json version (expected v$version)"
          [[ -n "${name// }" && "$name" != */* ]] || fail "plugin.json name '$name' is invalid"

          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true

          # Highest stable version among all tags (including this one).
          highest=$(git tag -l 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          latest=false
          [[ "$prerelease" == false && "$version" == "$highest" ]] && latest=true

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "name=$name"
            echo "prerelease=$prerelease"
            echo "latest=$latest"
            echo "repo_name=${GITHUB_REPOSITORY#*/}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing '$name' $version (prerelease=$prerelease, latest=$latest)"

      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Build
        shell: bash
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"

      - name: Package
        id: package
        shell: bash
        env:
          REPO_NAME: ${{ steps.meta.outputs.repo_name }}
          EXTRA_FILES: ${{ inputs.extra-files }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail() { echo "::error::$*"; exit 1; }
          [[ -f dist/index.js ]] || fail "build did not produce dist/index.js"

          stage="$RUNNER_TEMP/stage"
          dest="$stage/$REPO_NAME"
          rm -rf "$stage" && mkdir -p "$dest"

          # Layout from the Decky plugin template / Decky CLI.
          cp -r dist package.json plugin.json "$dest/"
          for f in main.py README* LICENSE* LICENCE*; do
            if [[ -e "$f" ]]; then cp -r "$f" "$dest/"; fi
          done
          if [[ -d py_modules && -n "$(ls -A py_modules)" ]]; then cp -r py_modules "$dest/"; fi
          if [[ -d defaults ]]; then cp -r defaults/. "$dest/"; fi
          if [[ -d backend/out ]]; then mkdir -p "$dest/bin" && cp -r backend/out/. "$dest/bin/"; fi
          for f in $EXTRA_FILES; do cp -r "$f" "$dest/"; done

          zip="$RUNNER_TEMP/$REPO_NAME.zip"
          rm -f "$zip"
          # Reproducible zip: fixed mtimes (tag commit time) and sorted entries.
          epoch=$(git log -1 --format=%ct)
          (cd "$stage" && find "$REPO_NAME" -exec touch -d "@$epoch" {} + \
            && find "$REPO_NAME" -print | LC_ALL=C sort | zip -qX "$zip" -@)
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          unzip -l "$zip"

      # Plugins must also work on NixOS, which has no dynamic loader at
      # /lib64 and no bash on Decky's PATH. See docs/plugin-development.md.
      - name: Check NixOS compatibility
        shell: bash
        env:
          REPO_NAME: ${{ steps.meta.outputs.repo_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/stage"
          failed=0
          fail() { echo "::error title=NixOS compatibility::$1: $2"; failed=1; }

          while IFS= read -r -d '' f; do
            if [[ "$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')" == 7f454c46 ]]; then
              # ELF: must not need a dynamic loader or shared libraries.
              if readelf -lW "$f" 2>/dev/null | grep -q 'Requesting program interpreter'; then
                fail "$f" "dynamically linked executable; build it statically"
              elif readelf -dW "$f" 2>/dev/null | grep -q '(NEEDED)'; then
                fail "$f" "depends on shared libraries ($(readelf -dW "$f" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | paste -sd, -)); build it statically, and don't ship compiled Python modules"
              fi
            elif [[ "$(head -c 2 "$f")" == '#!' && "$f" != *.py ]]; then
              # Scripts: only POSIX sh is guaranteed to exist.
              read -r -a cmd <<< "$(head -n 1 "$f" | cut -c3-)"
              interp="${cmd[0]:-}"
              if [[ "$interp" == /usr/bin/env ]]; then
                interp="${cmd[1]:-}"
                [[ "$interp" == -S ]] && interp="${cmd[2]:-}"
              fi
              if [[ "$interp" != /bin/sh && "$interp" != sh ]]; then
                fail "$f" "uses interpreter '$(head -n 1 "$f" | cut -c3-)'; use #!/bin/sh (POSIX sh)"
              fi
            fi
          done < <(find "$REPO_NAME" -type f -print0)

          if [[ "$failed" == 1 ]]; then
            echo "::error::The plugin would not work on NixOS. See https://github.com/paulmiro/decky-store-proxy/blob/main/docs/plugin-development.md#working-on-nixos"
            exit 1
          fi
          echo "No dynamically linked binaries or unsupported script interpreters found."

      - name: Write decky-store.json
        id: manifest
        shell: bash
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO_NAME: ${{ steps.meta.outputs.repo_name }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/decky-store.json"
          jq -n \
            --arg name "$NAME" \
            --arg version "$VERSION" \
            --arg artifact "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$REPO_NAME.zip" \
            --arg sha256 "$SHA256" \
            --arg created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile plugin plugin.json \
            '$plugin[0] as $p | {
              schema: 1,
              name: $name,
              version: $version,
              artifact: $artifact,
              sha256: $sha256,
              author: ($p.author // ""),
              description: ($p.publish.description // ""),
              tags: ($p.publish.tags // []),
              image_url: ($p.publish.image // ""),
              created: $created
            }' > "$out"
          cat "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.meta.outputs.name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          LATEST: ${{ steps.meta.outputs.latest }}
          ZIP: ${{ steps.package.outputs.zip }}
          MANIFEST: ${{ steps.manifest.outputs.path }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "$NAME $TAG" --generate-notes "--latest=$LATEST")
          [[ "$PRERELEASE" == true ]] && args+=(--prerelease)
          gh release create "$TAG" "$ZIP" "$MANIFEST" "${args[@]}"
